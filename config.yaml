project:
  name: smart-data-pipeline
  version: 0.1.0
  description: Configurable text classification pipeline
domain:
  topic: sailing and yacht navigation
  normalized_topic: sailing and yacht navigation
  classes:
  - navigation
  - safety
  - equipment
  - weather
  - licensing
  keywords_by_class:
    navigation:
    - route planning
    - waypoint
    - chartplotter
    - tide
    - course
    safety:
    - life jacket
    - colregs
    - man overboard
    - distress
    - watchkeeping
    equipment:
    - rigging
    - anchor
    - engine
    - electronics
    - maintenance
    weather:
    - forecast
    - wind
    - storm
    - barometer
    - sea state
    licensing:
    - regulation
    - certificate
    - compliance
    - exam
    - radio license
  review_label: other_or_offtopic
  language: en
sources:
  huggingface:
    datasets:
    - name: dair-ai/emotion
      split: train
      text_column: text
      limit: 300
    - name: mteb/tweet_sentiment_extraction
      split: test
      text_column: text
      limit: 300
    enabled: true
  scraping:
    cruisers_forum:
      base_url: https://www.cruisersforum.com
      sections:
      - /forums/f19/
      - /forums/f4/
      pages_per_section: 3
      enabled: true
    enabled: true
  rss:
    feeds:
    - https://www.yachtingworld.com/feed
    - https://www.cruisingworld.com/feed/
    - https://www.sailmagazine.com/feed
    - https://www.48north.com/feed/
    enabled: true
  stackexchange:
    api_url: https://api.stackexchange.com/2.3/questions
    site: outdoors
    tag: sailing
    pages: 5
    enabled: true
data:
  raw_path: data/raw
  labeled_path: data/labeled
  review_queue_path: data/review_queue.csv
annotation:
  confidence_threshold: 0.7
  model: facebook/bart-large-mnli
  batch_size: 16
  modality: text
  label_source: zero_shot
active_learning:
  strategy: entropy
  initial_size: 50
  batch_size: 20
  n_iterations: 5
  compare_strategies: true
model:
  type: sklearn
  base_model: logistic_regression
  exclude_offtopic: true
  test_size: 0.2
  random_state: 42
  tfidf:
    max_features: 10000
    ngram_range:
    - 1
    - 2
    sublinear_tf: true
  logreg:
    max_iter: 1000
    class_weight: balanced
    C: 1.0
  # distilbert:
  #   model_name: distilbert-base-uncased
  #   max_length: 128
  #   batch_size: 16
llm:
  provider: gemini
  model: models/gemini-flash-latest
  fallback_models:
  - models/gemini-2.5-flash
  - models/gemini-flash-latest
  - models/gemma-3-4b-it
  max_tokens: 1000
  temperature: 0.3
  max_prompt_chars: 2000
quality:
  strategy:
    html_entities: decode
    html_artifacts: remove
    duplicates: drop
    short_texts: filter
    long_texts: truncate
    missing: drop
  thresholds:
    short_text_min: 50
    long_text_max: 1000
  html_artifact_patterns:
  - wp
  - timeincuk
  - inspirewp
  - keyassets
  - figcaption
  - webfeedsfeaturedvisual
pipeline:
  orchestrator: prefect
  save_intermediate: true
